[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobradar-norway"
version = "0.1.0"
description = "Find and rank data jobs in Rogaland and remote, from NAV and FINN."
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "scikit-learn>=1.3", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pip-audit>=2.7"]

[project.scripts]
jobradar = "jobradar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
