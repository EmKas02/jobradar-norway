# Company career boards with public job feeds.
# Jobs are kept if they are in Rogaland, or remote and open to people in Norway.
# To add a company, find which system its careers page uses and add it below.
companies:
  # Stavanger-region offices
  - {name: Knowit, ats: teamtailor, host: careernorway.knowit.no}
  - {name: Schibsted (incl. Stavanger Aftenblad), ats: teamtailor, host: schibsted.teamtailor.com}
  - {name: Kongsberg Digital, ats: teamtailor, host: kongsbergdigital.teamtailor.com}
  - {name: Itera, ats: teamtailor, host: itera.teamtailor.com}
  - {name: Fjordkraft, ats: teamtailor, host: fjordkraft.teamtailor.com}
  - {name: Aize, ats: teamtailor, host: aize.teamtailor.com}
  # Norwegian tech companies that sometimes hire remotely
  - {name: Cognite, ats: greenhouse, slug: cognite}
  - {name: Tibber, ats: teamtailor, host: tibber.teamtailor.com}
  - {name: Computas, ats: teamtailor, host: computas.teamtailor.com}
  - {name: Kahoot!, ats: workable, slug: kahoot}
  - {name: Crayon, ats: workable, slug: crayon}
  - {name: Sanity, ats: ashby, slug: sanity}

# Remote job boards (searched for entry-level roles open to Norway)
remote:
  himalayas:
    queries: [data analyst, data scientist, data engineer, business intelligence, machine learning, analytics]

# FINN.no job search, used with FINN's written permission (Nov 2026) for a personal,
# non-commercial job search. Keep the load low; set enabled: false if FINN asks you to stop.
finn:
  enabled: true
  location: "1.20001.20012"   # Rogaland
  queries: [data, analytiker, power bi, python, maskinlæring, KI, nyutdannet, trainee, sommerstudent, business intelligence]
  delay_seconds: 3            # pause between every request to finn.no
  max_new_ads: 40             # full ad pages fetched per run (only ads not seen before)

# Large Stavanger employers that post mainly on FINN.no or their own portals
# (Equinor, Aker BP, Lyse, SpareBank 1 Sør-Norge, Vår Energi, ConocoPhillips):
# follow them on FINN and use the FINN inbox. ConocoPhillips' Workday site
# disallows automated access in robots.txt, so it is not fetched.
